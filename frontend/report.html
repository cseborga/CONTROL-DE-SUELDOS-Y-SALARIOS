<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes de Salarios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-logo-container">
          <img src="logo ML.jpeg" alt="Logo" class="brand-logo-img"/>
        </div>
        <div class="brand-details">
          <h1>Reportes de Salarios</h1>
        </div>
      </div>
    </div>
  </header>
  <main class="container">
    <h2>Listado de salarios</h2>
    <table id="tablaReportes" class="styled-table">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Cargo</th>
          <th>Obra</th>
          <th>Sueldo Básico</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data will be injected by app.js -->
      </tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
